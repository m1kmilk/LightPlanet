<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>虚拟星球光影系统</title>
  <style>
    :root { --planet-light: .92; --planet-size: 1.08; --glow: .8; --sky-1:#92d8ff; --sky-2:#dff5ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; color:#fff; font-family:"Microsoft YaHei", system-ui, sans-serif; background:#030818; transition:color 900ms ease; }
    .scene { position:relative; min-height:100vh; display:grid; place-items:center; isolation:isolate; }
    /* 三层天空通过透明度交叉淡入淡出，避免直接替换渐变产生跳色。 */
    .sky { position:absolute; inset:0; z-index:0; overflow:hidden; }
    .sky i { position:absolute; inset:0; opacity:0; transition:opacity 1800ms cubic-bezier(.22,.61,.36,1); }
    .sky-day { background:radial-gradient(ellipse at 77% 76%,rgba(255,236,180,.62),transparent 23%),radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.76),transparent 32%),radial-gradient(ellipse at 12% 84%,rgba(107,184,214,.28),transparent 38%),radial-gradient(ellipse at 50% 58%,rgba(255,255,255,.22),transparent 45%),linear-gradient(180deg,#438fc7 0%,#82bbdf 40%,#c5dce5 76%,#edf0e9 100%); }
    .sky-dusk { background:radial-gradient(ellipse at 74% 78%,rgba(255,211,144,.9),transparent 18%),radial-gradient(ellipse at 72% 100%,rgba(255,150,95,.45),transparent 40%),radial-gradient(ellipse at 9% 18%,rgba(87,74,145,.75),transparent 48%),linear-gradient(180deg,#252d58 0%,#625075 39%,#bd7774 72%,#f0b181 100%); }
    .sky-night { background:radial-gradient(ellipse at 75% 92%,rgba(34,64,112,.5),transparent 38%),radial-gradient(ellipse at 50% 60%,rgba(19,40,76,.35),transparent 47%),linear-gradient(180deg,#02040d 0%,#070e20 50%,#101d34 100%); }
    body.day .sky-day, body.dusk .sky-dusk, body.night .sky-night { opacity:1; }
    .stars, .clouds, .meteors, .particles { z-index:1; }
    .hud, .connection, .planet-wrap, .connect-btn, .warning { z-index:2; }
    .scene::after { content:""; position:absolute; inset:0; z-index:-1; background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.16),transparent 48%); pointer-events:none; }
    .stars, .clouds, .meteors { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
    /* 低空的空气透视层，让天空靠近地平线时更亮、更柔和。 */
    .clouds::before { content:""; position:absolute; left:-8%; right:-8%; bottom:-16%; height:42%; background:radial-gradient(ellipse at 50% 100%,rgba(249,250,242,.66),rgba(221,235,237,.22) 43%,transparent 76%); filter:blur(24px); opacity:0; transition:opacity 1.2s ease; }
    body.day .clouds::before { opacity:.85; }
    body.dusk .clouds::before { opacity:.62; background:radial-gradient(ellipse at 70% 100%,rgba(255,182,133,.72),rgba(228,144,145,.2) 45%,transparent 78%); }
    .particles { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; opacity:.7; transition:opacity 900ms ease; }
    body.day .particles { opacity:.28; } body.dusk .particles { opacity:.56; }
    .stars { opacity:0; transition:opacity 900ms ease; }
    body.night .stars { opacity:1; }
    .star { position:absolute; width:var(--s); height:var(--s); left:var(--x); top:var(--y); border-radius:50%; background:white; box-shadow:0 0 8px 2px #bce8ff; opacity:.25; animation:twinkle var(--d) ease-in-out infinite alternate; animation-delay:var(--delay); }
    @keyframes twinkle { to { opacity:1; transform:scale(1.9); } }
    .cloud { position:absolute; width:360px; height:112px; border-radius:50%; background:radial-gradient(ellipse at 25% 68%,rgba(255,255,255,.78),transparent 43%),radial-gradient(ellipse at 45% 46%,rgba(255,255,255,.91),transparent 47%),radial-gradient(ellipse at 69% 69%,rgba(248,253,255,.8),transparent 43%),radial-gradient(ellipse at 52% 88%,rgba(126,164,185,.24),transparent 55%); filter:blur(5px); opacity:0; transition:opacity 1.2s ease,filter 1.2s ease; animation:drift 46s linear infinite; }
    .cloud::before,.cloud::after { content:""; position:absolute; border-radius:50%; background:radial-gradient(ellipse at 42% 36%,rgba(255,255,255,.94),rgba(255,255,255,.68) 42%,rgba(173,202,215,.2) 72%,transparent 74%); }
    .cloud::before { width:168px; height:130px; left:56px; bottom:13px; } .cloud::after { width:190px; height:154px; left:145px; bottom:1px; }
    .cloud.one { top:17%; left:-390px; } .cloud.two { top:66%; left:-480px; animation-duration:66s; animation-delay:-31s; transform:scale(.74); filter:blur(9px); }
    body.day .cloud { opacity:.72; } body.dusk .cloud { opacity:.26; filter:sepia(.55) saturate(.85) blur(7px); }
    @keyframes drift { to { translate:calc(100vw + 620px) 0; } }
    .hud { position:absolute; top:clamp(18px,4vw,42px); left:clamp(18px,4vw,54px); padding:14px 17px; min-width:215px; border:1px solid rgba(255,255,255,.35); border-radius:16px; background:rgba(8,20,45,.16); backdrop-filter:blur(14px); box-shadow:0 12px 38px rgba(0,20,50,.12); }
    body.day .hud { color:#163554; background:rgba(255,255,255,.36); border-color:rgba(255,255,255,.7); }
    .eyebrow { font-size:11px; letter-spacing:.16em; opacity:.68; } .value { margin:3px 0; font-family:ui-monospace,monospace; font-size:42px; font-weight:700; line-height:1; } .unit { font-size:13px; opacity:.72; }
    .state { display:inline-block; margin-top:9px; padding:4px 10px; border-radius:999px; font-size:13px; background:rgba(255,255,255,.18); }
    .connection { position:absolute; top:clamp(18px,4vw,42px); right:clamp(18px,4vw,54px); display:flex; align-items:center; gap:9px; font-size:13px; padding:10px 13px; border-radius:999px; background:rgba(5,12,28,.24); backdrop-filter:blur(12px); }
    .dot { width:9px; height:9px; border-radius:50%; background:#ff6b73; box-shadow:0 0 10px #ff6b73; } .connected .dot { background:#54edaa; box-shadow:0 0 10px #54edaa; }
    .planet-wrap { position:relative; display:grid; place-items:center; text-align:center; margin-top:40px; }
    .planet-wrap::before { content:""; position:absolute; width:min(64vw,520px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(175,232,255,calc(var(--glow) * .24)),rgba(77,177,240,calc(var(--glow) * .08)) 38%,transparent 70%); filter:blur(7px); transition:opacity 1.1s ease; pointer-events:none; }
    .planet-wrap::after { content:""; position:absolute; width:min(59vw,470px); height:min(19vw,150px); border:1px solid rgba(179,232,255,.4); border-radius:50%; transform:rotate(-18deg); box-shadow:0 0 16px rgba(126,221,255,.2),inset 0 0 12px rgba(126,221,255,.12); opacity:calc(.18 + var(--glow) * .38); pointer-events:none; }
    .planet { position:relative; z-index:1; width:min(47vw,390px); aspect-ratio:1; border-radius:50%; transform:scale(var(--planet-size)); transition:transform 1000ms cubic-bezier(.22,.61,.36,1),filter 1050ms ease,box-shadow 1200ms ease; will-change:transform,filter,box-shadow; overflow:hidden; background:radial-gradient(circle at 31% 24%,#fff 0 1%,rgba(235,250,255,.9) 8%,transparent 23%),radial-gradient(circle at 34% 27%,#dffaff 0%,#74c4df 23%,#347b9c 50%,#16384e 78%,#0c1729 100%); box-shadow:inset -42px -38px 65px rgba(0,5,18,.68), inset 16px 12px 28px rgba(255,255,255,.56),0 0 calc(70px * var(--glow)) calc(12px * var(--glow)) rgba(182,229,255,.72); filter:brightness(var(--planet-light)); }
    .planet::before { content:""; z-index:2; position:absolute; width:68%; height:17%; left:13%; top:24%; border-radius:50%; background:rgba(255,255,255,.27); filter:blur(1px); box-shadow:25px 102px 0 -7px rgba(230,255,255,.18),-124px 169px 0 -8px rgba(232,250,255,.13),85px 213px 0 -15px rgba(255,255,255,.15); transform:rotate(-25deg); animation:cloudBelt 19s ease-in-out infinite alternate; }
    .planet::after { content:""; z-index:4; position:absolute; inset:-1px; border-radius:inherit; background:linear-gradient(112deg,transparent 36%,rgba(9,23,39,.12) 50%,rgba(0,5,17,.86) 86%),repeating-linear-gradient(11deg,transparent 0 19px,rgba(255,255,255,.025) 20px 21px); mix-blend-mode:multiply; pointer-events:none; }
    .planet .terrain, .planet .grid, .planet .aurora, .planet .rim { position:absolute; pointer-events:none; }
    .terrain { z-index:1; border-radius:48% 52% 39% 61% / 54% 37% 63% 46%; opacity:.62; }
    .terrain.a { width:43%; height:30%; left:12%; top:47%; background:radial-gradient(ellipse at 62% 32%,#9de0c2 0 11%,transparent 12%),radial-gradient(ellipse at 28% 61%,#3a9a8d 0 24%,transparent 25%),radial-gradient(ellipse at 74% 72%,#5fb9a1 0 18%,transparent 19%),#226d75; transform:rotate(-19deg); animation:surfaceFloat 34s ease-in-out infinite alternate; }
    .terrain.b { width:38%; height:25%; right:10%; top:39%; background:radial-gradient(ellipse at 42% 48%,#b1e8c2 0 17%,transparent 18%),radial-gradient(ellipse at 69% 76%,#429c8d 0 20%,transparent 21%),#1d6570; transform:rotate(22deg); animation:surfaceFloat 41s -16s ease-in-out infinite alternate-reverse; }
    .terrain.c { width:23%; height:16%; left:36%; top:17%; background:radial-gradient(circle at 38% 55%,#70bca1 0 22%,transparent 23%),#2b7880; transform:rotate(12deg); opacity:.58; }
    .terrain.a::after,.terrain.b::after { content:""; position:absolute; inset:8%; border-radius:inherit; background:repeating-linear-gradient(24deg,transparent 0 9px,rgba(211,255,231,.22) 10px,transparent 12px 18px); mask-image:radial-gradient(ellipse,black 22%,transparent 76%); opacity:.6; }
    .crater { z-index:3; position:absolute; border-radius:50%; background:radial-gradient(ellipse at 36% 30%,rgba(227,255,255,.42),rgba(113,185,198,.2) 30%,rgba(5,37,57,.48) 59%,rgba(191,241,242,.3) 72%,rgba(5,39,55,.18) 83%,transparent 86%); box-shadow:inset -4px -5px 8px rgba(0,15,31,.24),0 1px 2px rgba(223,255,255,.18); opacity:.8; }
    .crater.c1 { width:42px;height:29px;left:61%;top:27%;transform:rotate(-23deg); }
    .crater.c2 { width:27px;height:19px;left:27%;top:68%;transform:rotate(18deg);opacity:.64; }
    .crater.c3 { width:19px;height:14px;left:72%;top:57%;transform:rotate(-8deg);opacity:.58; }
    .crater.c4 { width:13px;height:10px;left:46%;top:43%;transform:rotate(32deg);opacity:.5; }
    .crater.c5 { width:32px;height:23px;left:43%;top:79%;transform:rotate(-18deg);opacity:.55; }
    .surface-cloud { z-index:3; position:absolute; width:54%;height:8%;left:14%;top:38%;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(222,255,255,.56),rgba(255,255,255,.35),transparent);filter:blur(5px);transform:rotate(-22deg);opacity:.68;animation:surfaceCloud 25s ease-in-out infinite alternate; }
    .surface-cloud.s2 { width:38%;left:48%;top:73%;transform:rotate(14deg);opacity:.42;animation-delay:-11s;animation-duration:31s; }
    .grid { z-index:2; inset:0; opacity:.07; background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 13%,rgba(214,250,255,.7) 13.5% 14%,transparent 14.7% 21%),repeating-linear-gradient(90deg,transparent 0 22%,rgba(210,248,255,.55) 22.4% 22.8%,transparent 23.2% 40%); transform:scale(1.18); }
    .aurora { z-index:3; width:82%; height:18%; left:9%; top:66%; border-radius:50%; background:linear-gradient(90deg,transparent,rgba(105,255,213,.3),rgba(103,194,255,.35),transparent); filter:blur(6px); transform:rotate(-18deg); opacity:calc(.1 + var(--glow) * .2); animation:auroraPulse 10s ease-in-out infinite alternate; }
    .rim { z-index:5; inset:2%; border:1px solid rgba(222,249,255,.62); border-radius:50%; box-shadow:inset 3px 3px 8px rgba(255,255,255,.45),0 0 9px rgba(157,235,255,.24); opacity:calc(.2 + var(--glow) * .32); }
    @keyframes cloudBelt { from { transform:translateX(-4px) rotate(-25deg); } to { transform:translateX(11px) rotate(-22deg); } }
    @keyframes surfaceFloat { from { translate:-4px -2px; } to { translate:8px 3px; } }
    @keyframes surfaceCloud { from { translate:-5px 0; } to { translate:12px 2px; } }
    @keyframes auroraPulse { to { opacity:calc(.2 + var(--glow) * .36); filter:blur(13px); } }
    .planet-label { margin-top:32px; font-size:clamp(14px,2vw,18px); letter-spacing:.3em; text-indent:.3em; text-shadow:0 2px 10px rgba(0,0,0,.35); }
    .connect-btn { position:absolute; bottom:clamp(25px,5vw,54px); border:1px solid rgba(255,255,255,.62); padding:13px 21px; border-radius:999px; background:rgba(255,255,255,.16); color:inherit; cursor:pointer; font:inherit; letter-spacing:.07em; backdrop-filter:blur(12px); transition:transform .2s,background .2s; } .connect-btn:hover { transform:translateY(-2px); background:rgba(255,255,255,.27); }
    .warning { position:absolute; left:50%; bottom:100px; transform:translate(-50%,15px); opacity:0; pointer-events:none; white-space:nowrap; padding:12px 18px; border-radius:12px; color:#fff; background:rgba(178,35,49,.92); box-shadow:0 12px 28px rgba(0,0,0,.25); transition:opacity .28s,transform .28s; } .warning.show { opacity:1; transform:translate(-50%,0); }
    .meteor { position:absolute; width:210px; height:2px; border-radius:50%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.95) 72%,#fff); transform:rotate(34deg); filter:drop-shadow(0 0 7px #a9e8ff); animation:shoot 1.15s ease-out forwards; }
    .meteor::after { content:""; position:absolute; right:-3px; top:-2px; width:6px; height:6px; border-radius:50%; background:#fff; box-shadow:0 0 9px 3px #b8eaff; }
    .meteor.natural { width:150px; opacity:0; animation-duration:1.65s; }
    @keyframes shoot { 0% { translate:0 0; opacity:0; } 12% { opacity:1; } 82% { opacity:.9; } 100% { translate:430px 290px; opacity:0; } }
    @media(max-width:600px){ .planet{width:70vw}.hud{transform:scale(.9);transform-origin:top left}.connection{font-size:11px}.warning{font-size:13px;white-space:normal;width:85%;text-align:center}.planet-label{margin-top:22px} }
  </style>
</head>
<body class="day">
  <main class="scene">
    <div class="sky" aria-hidden="true"><i class="sky-day"></i><i class="sky-dusk"></i><i class="sky-night"></i></div>
    <canvas class="particles" id="particles" aria-hidden="true"></canvas>
    <div class="stars" id="stars"></div>
    <div class="clouds"><i class="cloud one"></i><i class="cloud two"></i></div>
    <div class="meteors" id="meteors"></div>
    <section class="hud"><div class="eyebrow">REAL-TIME LIGHT LEVEL</div><div class="value"><span id="lightValue">--</span> <span class="unit">/ 1023</span></div><div class="state" id="lightState">等待传感器数据</div></section>
    <div class="connection" id="connection"><i class="dot"></i><span id="connectionText">串口未连接</span></div>
    <section class="planet-wrap"><div class="planet" id="planet"><i class="terrain a"></i><i class="terrain b"></i><i class="terrain c"></i><i class="surface-cloud"></i><i class="surface-cloud s2"></i><i class="crater c1"></i><i class="crater c2"></i><i class="crater c3"></i><i class="crater c4"></i><i class="crater c5"></i><i class="grid"></i><i class="aurora"></i><i class="rim"></i></div><div class="planet-label">VIRTUAL PLANET</div></section>
    <button class="connect-btn" id="connectButton">连接 Arduino 串口</button>
    <div class="warning" id="warning">光线传感器信号丢失，请检查 A0 接线</div>
  </main>
  <script>
    // 创建固定数量的随机星星；夜晚时通过 CSS 显示并闪烁。
    const stars = document.querySelector('#stars');
    for (let i=0;i<95;i++) { const s=document.createElement('i'); s.className='star'; s.style.setProperty('--x',Math.random()*100+'%'); s.style.setProperty('--y',Math.random()*100+'%'); s.style.setProperty('--s',(Math.random()*2.7+1)+'px'); s.style.setProperty('--d',(Math.random()*2.4+1.1)+'s'); s.style.setProperty('--delay',-Math.random()*3+'s'); stars.appendChild(s); }

    const $ = id => document.getElementById(id);
    const body = document.body, valueEl=$('lightValue'), stateEl=$('lightState'), planet=$('planet');
    const connection=$('connection'), connectionText=$('connectionText'), button=$('connectButton'), warning=$('warning');
    const particleCanvas=$('particles'), particleCtx=particleCanvas.getContext('2d');
    let port, reader, connected=false, lastDataAt=0, connectedAt=0, hasReceivedData=false, previousValue=null, lastChangeAt=0, rapidChanges=0;
    // targetValue 是最新传感器值，visualValue 由动画循环渐进追随它。
    // 这样硬件数值有小幅波动时，视觉元素不会一帧一帧地跳动。
    let targetValue=512, visualValue=512, hasVisualValue=false, planetAnimating=false, lastParticleFrame=0;

    // 轻量 Canvas 粒子：越暗，粒子越亮、飘动越明显。
    const particles=Array.from({length:42},()=>({x:Math.random(),y:Math.random(),size:Math.random()*1.45+.35,phase:Math.random()*Math.PI*2,drift:Math.random()*.012+.004,twinkle:Math.random()*Math.PI*2}));
    function resizeParticles(){ const ratio=Math.min(devicePixelRatio||1,2); particleCanvas.width=innerWidth*ratio; particleCanvas.height=innerHeight*ratio; particleCtx.setTransform(ratio,0,0,ratio,0,0); }
    function drawParticles(t){
      // 粒子固定约 30fps；星球与串口读取仍按正常节奏工作。
      if(t-lastParticleFrame<33){ requestAnimationFrame(drawParticles); return; }
      lastParticleFrame=t;
      const w=innerWidth,h=innerHeight, darkness=targetValue/1023;
      particleCtx.clearRect(0,0,w,h);
      particles.forEach(p=>{
        // 固定方向的慢速漂移，避免粒子到边缘后突然跳回画面中央。
        p.x-=p.drift*(.18+darkness*.28); p.y-=p.drift*.32;
        if(p.x<-.025){p.x=1.025;p.y=Math.random()*1.06;}
        if(p.y<-.04){p.y=1.04;p.x=Math.random()*1.06;}
        const x=p.x*w+Math.sin(t*.00016+p.phase)*4, y=p.y*h;
        const a=(.025+darkness*.24)*(.55+.45*Math.sin(t*.0011+p.twinkle));
        particleCtx.beginPath(); particleCtx.fillStyle=`rgba(177,225,255,${a})`; particleCtx.arc(x,y,p.size+darkness*.35,0,Math.PI*2); particleCtx.fill();
      });
      requestAnimationFrame(drawParticles);
    }
    resizeParticles(); addEventListener('resize',resizeParticles); requestAnimationFrame(drawParticles);


    function setConnection(isConnected, message) { connected=isConnected; connection.classList.toggle('connected',isConnected); connectionText.textContent=message; button.textContent=isConnected ? '断开串口' : '连接 Arduino 串口'; }
    function lightStatus(v) { if(v<260)return ['强光','day']; if(v<560)return ['正常','dusk']; if(v<820)return ['昏暗','night']; return ['黑暗','night']; }
    function applyLight(v) {
      valueEl.textContent=v; // 数字保留最新的真实串口读数
      targetValue=v;
      const [label,mode]=lightStatus(v); stateEl.textContent=label;
      body.classList.remove('day','dusk','night'); body.classList.add(mode);
      schedulePlanetRender();
    }
    function schedulePlanetRender(){
      if(!planetAnimating){ planetAnimating=true; requestAnimationFrame(renderPlanet); }
    }
    function renderPlanet() {
      // 每一帧只靠近目标值的 7%，形成柔和且没有延迟感的惯性过渡。
      visualValue += (targetValue-visualValue)*0.07;
      const remaining=Math.abs(targetValue-visualValue);
      if(remaining<0.08) visualValue=targetValue;
      const v=visualValue;
      // 本项目传感器定义：读数越低越亮，所以反向换算为视觉亮度。
      const brightness=1-v/1023;
      document.documentElement.style.setProperty('--planet-light',(0.25+brightness*1.05).toFixed(2));
      document.documentElement.style.setProperty('--planet-size',(0.88+brightness*.24).toFixed(2));
      document.documentElement.style.setProperty('--glow',(0.15+brightness*1.05).toFixed(2));
      // 接近目标后停止动画循环，避免静止状态持续占用 GPU。
      if(remaining>=0.08) requestAnimationFrame(renderPlanet);
      else planetAnimating=false;
    }
    function meteor(natural=false) { const m=document.createElement('i'); m.className=natural?'meteor natural':'meteor'; m.style.left=(5+Math.random()*42)+'%'; m.style.top=(Math.random()*32)+'%'; $('meteors').appendChild(m); setTimeout(()=>m.remove(),natural?1800:1250); }
    // 夜间低频随机出现自然流星；快速遮挡触发的彩蛋流星仍保持原有逻辑。
    function scheduleNightMeteor(){
      const delay=1600+Math.random()*3400;
      setTimeout(()=>{
        if(body.classList.contains('night')) {
          meteor(true);
          // 偶尔连着划过两颗，制造稀疏的流星雨感。
          if(Math.random()<.58) setTimeout(()=>{ if(body.classList.contains('night')) meteor(true); },360+Math.random()*520);
          if(Math.random()<.18) setTimeout(()=>{ if(body.classList.contains('night')) meteor(true); },980+Math.random()*480);
        }
        scheduleNightMeteor();
      },delay);
    }
    scheduleNightMeteor();
    function receiveValue(v) {
      lastDataAt=Date.now();
      if(!hasReceivedData) setConnection(true,'Arduino 已连接，数据正常');
      hasReceivedData=true;
      warning.classList.remove('show');
      // 一秒半内出现三次大幅变化，认为用户快速遮挡并松开，触发流星。
      if(previousValue!==null && Math.abs(v-previousValue)>130) { if(Date.now()-lastChangeAt<1500) rapidChanges++; else rapidChanges=1; lastChangeAt=Date.now(); if(rapidChanges>=3) { meteor(); rapidChanges=0; } }
      previousValue=v;
      // 第一个读数直接作为初始画面，后续读数才采用缓动追随。
      if(!hasVisualValue) { visualValue=v; hasVisualValue=true; }
      applyLight(v);
    }
    async function disconnect() {
      connected=false; try { if(reader) { await reader.cancel(); } } catch(e) {} try { if(port) await port.close(); } catch(e) {}
      reader=null; port=null; hasReceivedData=false; setConnection(false,'串口未连接');
    }
    async function readLoop() {
      const decoder=new TextDecoder(); let buffer='';
      try { while(port && port.readable) { reader=port.readable.getReader(); try { while(true) { const {value,done}=await reader.read(); if(done)break; buffer+=decoder.decode(value,{stream:true}); const lines=buffer.split(/\r?\n/); buffer=lines.pop(); lines.forEach(line=>{ const text=line.trim(); if(/^\d{1,4}$/.test(text)) { const n=Number(text); if(n>=0&&n<=1023) receiveValue(n); } }); } } finally { reader.releaseLock(); reader=null; } } } catch(e) { console.warn(e); } finally { if(connected) disconnect(); }
    }
    button.addEventListener('click',async()=>{
      if(connected) { await disconnect(); return; }
      if(!('serial' in navigator)) { alert('当前浏览器不支持 Web Serial。请使用桌面版 Chrome 浏览器。'); return; }
      try {
        port=await navigator.serial.requestPort();
        await port.open({baudRate:9600});
        // Uno 打开串口会自动复位。给它 3 秒完成启动，避免首次连接的误报。
        connectedAt=Date.now(); lastDataAt=connectedAt; hasReceivedData=false;
        setConnection(true,'Arduino 已连接，等待数据…');
        readLoop();
      }
      catch(e) { console.warn(e); if(e.name!=='NotFoundError') alert('无法连接串口：'+e.message); await disconnect(); }
    });
    // 已连接时持续检查最后一次数据时间，超过 1 秒显示接线提醒。
    setInterval(()=>{
      if(!connected) return;
      // 首次连接留出 Uno 的自动复位时间；收到过数据后严格按 1 秒检测。
      if(!hasReceivedData && Date.now()-connectedAt < 3000) return;
      if(Date.now()-lastDataAt>1000) warning.classList.add('show');
    },250);
    if('serial' in navigator) navigator.serial.addEventListener('disconnect',()=>{ if(connected) disconnect(); });
  </script>
</body>
